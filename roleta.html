<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta Premiada - Nexus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #060b19 0%, #020408 100%);
            --card-glass: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.07);
            --blue-primary: #0052ff;
            --cyan-neon: #00d2ff;
            --green-success: #00e676;
            --text-muted: #8a99ad;
            --gold: #ffd700;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
            outline: none !important; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background: var(--bg-gradient); 
            color: white; 
            padding-bottom: 110px; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        /* Top Bar */
        .top-bar { 
            padding: 25px 20px 15px 20px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
        }
        .btn-back {
            color: var(--text-muted);
            font-size: 1.2rem;
            text-decoration: none;
            width: 40px; height: 40px;
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .btn-back:active { transform: scale(0.9); }
        .page-title { font-weight: 700; font-size: 1.1rem; color: #fff; }

        /* Card de Giros */
        .spin-status-card {
            margin: 10px 20px 20px 20px;
            background: rgba(0, 82, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .spin-status-card h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .spin-status-card h2 { font-size: 1.8rem; font-weight: 800; color: var(--cyan-neon); display: flex; justify-content: center; align-items: center; gap: 10px;}

        /* Container da Roleta */
        .roleta-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 2.8rem;
            color: var(--gold);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        /* Elemento SVG da Roleta */
        .wheel-svg {
            width: 100%;
            height: 100%;
            transform: rotate(0deg);
            transition: transform 5s cubic-bezier(0.25, 1, 0.2, 1);
            filter: drop-shadow(0 0 20px rgba(0, 82, 255, 0.2));
        }

        /* Estilização das Fatias do SVG */
        .slice-even { fill: #0b1329; stroke: rgba(255,255,255,0.05); stroke-width: 1; }
        .slice-odd { fill: #0052ff; stroke: rgba(255,255,255,0.05); stroke-width: 1; }
        .slice-premium { fill: #00e676; stroke: rgba(255,255,255,0.05); stroke-width: 1; }
        
        .prize-text {
            font-weight: 800;
            font-size: 13px;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .prize-text.dark { fill: #020408; }

        /* Botão de Ação */
        .action-area { text-align: center; margin-top: 25px; }
        .btn-spin {
            background: linear-gradient(135deg, var(--blue-primary), var(--cyan-neon));
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 16px 55px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.3);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn-spin:active:not(:disabled) { transform: scale(0.95); }
        .btn-spin:disabled { background: var(--card-glass); color: var(--text-muted); box-shadow: none; cursor: not-allowed; border: 1px solid var(--card-border); }

        /* Menu Inferior Sincronizado */
        .nav-bottom { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(2, 4, 8, 0.85); display: flex; 
            justify-content: space-around; padding: 12px 0; 
            border-top: 1px solid rgba(255,255,255,0.06); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 10000; height: 76px; align-items: center;
        }
        .nav-item { color: #4b5563; text-align: center; text-decoration: none; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; transition: 0.2s; }
        .nav-item i { font-size: 1.25rem; }
        .nav-item span { font-size: 0.68rem; font-weight: 500; }
        .nav-item.active { color: #fff; }
        .nav-item.active i { color: var(--cyan-neon); filter: drop-shadow(0 0 6px rgba(0, 210, 255, 0.5)); }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="home.html" class="btn-back"><i class="fas fa-chevron-left"></i></a>
        <div class="page-title">Roleta Premiada</div>
    </div>

    <div class="spin-status-card animate__animated animate__fadeInDown">
        <h3>Seus Giros Disponíveis</h3>
        <h2><i class="fas fa-ticket-alt"></i> <span id="giros-count">-</span></h2>
    </div>

    <div class="roleta-container animate__animated animate__zoomIn">
        <div class="pointer"><i class="fas fa-sort-down"></i></div>
        
        <svg class="wheel-svg" id="wheel" viewBox="0 0 300 300">
            <defs>
                <path id="slice-template" d="M 150 150 L 275.57 77.5 A 145 145 0 0 1 275.57 222.5 Z" />
            </defs>

            <circle cx="150" cy="150" r="147" fill="none" stroke="var(--card-border)" stroke-width="4" />
            
            <g transform="rotate(270 150 150)">
                <use href="#slice-template" class="slice-premium" />
                <text x="220" y="150" class="prize-text dark" transform="rotate(0 220 150)">R$ 100</text>
            </g>

            <g transform="rotate(330 150 150)">
                <use href="#slice-template" class="slice-odd" />
                <text x="220" y="150" class="prize-text" transform="rotate(0 220 150)">R$ 10</text>
            </g>

            <g transform="rotate(30 150 150)">
                <use href="#slice-template" class="slice-even" />
                <text x="220" y="150" class="prize-text" transform="rotate(0 220 150)">Nada</text>
            </g>

            <g transform="rotate(90 150 150)">
                <use href="#slice-template" class="slice-odd" />
                <text x="220" y="150" class="prize-text" transform="rotate(0 220 150)">R$ 20</text>
            </g>

            <g transform="rotate(150 150 150)">
                <use href="#slice-template" class="slice-even" />
                <text x="220" y="150" class="prize-text" transform="rotate(0 220 150)">R$ 50</text>
            </g>

            <g transform="rotate(210 150 150)">
                <use href="#slice-template" class="slice-odd" />
                <text x="220" y="150" class="prize-text" transform="rotate(0 220 150)">R$ 5</text>
            </g>

            <circle cx="150" cy="150" r="22" fill="#020408" stroke="var(--cyan-neon)" stroke-width="3" />
            <circle cx="150" cy="150" r="6" fill="var(--blue-primary)" />
        </svg>
    </div>

    <div class="action-area animate__animated animate__fadeInUp">
        <button id="btn-spin" class="btn-spin" disabled>Sincronizando...</button>
    </div>

    <nav class="nav-bottom">
        <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="planos.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Planos</span></a>
        <a href="indicacao.html" class="nav-item"><i class="fas fa-share-alt"></i><span>Indicar</span></a>
        <a href="perfil.html" class="nav-item active"><i class="fas fa-user-alt"></i><span>Perfil</span></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, setDoc, increment, addDoc, collection, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKDFw7khZzM9hIX7xbbrbFQeESiCLnmOw",
            authDomain: "monety-site-9175f.firebaseapp.com",
            projectId: "monety-site-9175f",
            storageBucket: "monety-site-9175f.firebasestorage.app",
            messagingSenderId: "840821848803",
            appId: "1:840821848803:web:b99a5528e4bb925518a3d6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userDocRef = null;
        let girosAtuais = 0;
        let isSpinning = false;
        let degreesGiroTotal = 0;

        // Ângulos mapeados com base no centro de cada rotação do grupo de fatias
        const premios = [
            { valor: 100, anguloCentro: 270 },
            { valor: 10,  anguloCentro: 330 },
            { valor: 0,   anguloCentro: 30  },
            { valor: 20,  anguloCentro: 90  },
            { valor: 50,  anguloCentro: 150 },
            { valor: 5,   anguloCentro: 210 }
        ];

        function puxarPremio() {
            const r = Math.random() * 100;
            if (r < 45) return premios[2];  // 45% chance: Nada
            if (r < 75) return premios[5];  // 30% chance: R$ 5
            if (r < 90) return premios[1];  // 15% chance: R$ 10
            if (r < 97) return premios[3];  // 7% chance: R$ 20
            if (r < 99.5) return premios[4]; // 2.5% chance: R$ 50
            return premios[0];               // 0.5% chance: R$ 100
        }

        const btnSpin = document.getElementById('btn-spin');
        const girosDisplay = document.getElementById('giros-count');
        const wheel = document.getElementById('wheel');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userDocRef = doc(db, "usuarios", user.uid);
                
                onSnapshot(userDocRef, async (snap) => {
                    // AUTO-INICIALIZADOR PROTEGIDO: Cria o documento se ele não existir
                    if (!snap.exists()) {
                        await setDoc(userDocRef, {
                            giros: 1,
                            saldo: 0,
                            saldoLucro: 0,
                            totalGanhos: 0,
                            status: "ativo"
                        }, { merge: true });
                        return; 
                    }

                    if (!isSpinning) {
                        const data = snap.data();
                        // Garante que se o campo giros não existir, vire 0 em vez de travar o app
                        girosAtuais = data.giros !== undefined ? data.giros : 0;
                        girosDisplay.innerText = girosAtuais;
                        
                        if(girosAtuais > 0) {
                            btnSpin.disabled = false;
                            btnSpin.innerText = "Girar Roleta";
                        } else {
                            btnSpin.disabled = true;
                            btnSpin.innerText = "Sem Giros";
                        }
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        btnSpin.addEventListener('click', async () => {
            if (girosAtuais <= 0 || isSpinning) return;

            isSpinning = true;
            btnSpin.disabled = true;
            btnSpin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sorteando...';

            try {
                // Deduz o giro do banco imediatamente (evita fraudes de duplo clique)
                await updateDoc(userDocRef, { giros: increment(-1) });

                const sorteado = puxarPremio();
                
                // Cálculo de rotação baseado no ponteiro fixo no topo (270°)
                const voltasCompletas = 360 * 5; 
                const ajusteDestino = (270 - sorteado.anguloCentro + 360) % 360;
                
                degreesGiroTotal += voltasCompletas + ajusteDestino - (degreesGiroTotal % 360);
                wheel.style.transform = `rotate(${degreesGiroTotal}deg)`;

                setTimeout(async () => {
                    isSpinning = false;

                    // Cria histórico do giro usado
                    await addDoc(collection(db, "historico_giros"), {
                        userId: auth.currentUser.uid,
                        quantidade: -1,
                        motivo: "uso_roleta",
                        detalhe: sorteado.valor > 0 ? `Ganhou R$ ${sorteado.valor},00` : "Não premiado",
                        timestamp: Timestamp.now()
                    });

                    if (sorteado.valor > 0) {
                        // Acrescenta saldo diretamente na carteira de lucros
                        await updateDoc(userDocRef, {
                            saldoLucro: increment(sorteado.valor),
                            totalGanhos: increment(sorteado.valor)
                        });

                        await addDoc(collection(db, "historico"), {
                            userId: auth.currentUser.uid,
                            valor: sorteado.valor,
                            tipo: 'Premio Roleta',
                            data: Timestamp.now()
                        });

                        Swal.fire({
                            title: 'Parabéns!',
                            html: `Você ganhou <span style="color:var(--green-success);font-weight:700">R$ ${sorteado.valor},00</span>!`,
                            icon: 'success',
                            background: '#060b19',
                            color: '#fff',
                            confirmButtonColor: '#0052ff'
                        });
                    } else {
                        Swal.fire({
                            title: 'Quase lá!',
                            text: 'Não foi dessa vez! Indique mais amigos para conseguir novos giros.',
                            icon: 'info',
                            background: '#060b19',
                            color: '#fff',
                            confirmButtonColor: '#0052ff'
                        });
                    }
                    
                    girosDisplay.innerText = girosAtuais - 1;
                    if ((girosAtuais - 1) > 0) {
                        btnSpin.disabled = false;
                        btnSpin.innerText = "Girar Novamente";
                    } else {
                        btnSpin.innerText = "Sem Giros";
                    }

                }, 5000);

            } catch (err) {
                console.error(err);
                isSpinning = false;
                btnSpin.disabled = false;
                btnSpin.innerText = "Tentar Novamente";
            }
        });
    </script>
</body>
</html>
